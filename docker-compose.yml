# docker compose up -d --build   →   http://localhost:3002
# Needs the API (dns.be) on the host's port 4000; the website (dns.fe) on port 3000 serves the product images.
services:
  admin:
    build: .
    image: dns-app
    container_name: dns-admin
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      API_URL: http://host.docker.internal:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/login']
      interval: 10s
      timeout: 5s
      retries: 5
