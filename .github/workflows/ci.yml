name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes type check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start container
        run: docker compose up -d --build --wait

      # No API in CI: only check the pages that work without it
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null http://localhost:3002/login
          # Logged-out visitors are sent to the login page
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/products)
          location=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3002/products)
          echo "GET /products -> $status $location"
          test "$status" = 307
          case "$location" in */login*) ;; *) exit 1 ;; esac

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
